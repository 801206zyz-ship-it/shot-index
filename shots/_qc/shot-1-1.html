<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>两家公司是谁：企业背景双雄档案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#07070a;overflow:hidden}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  background:#cfc4ab;color:#2b2620;
  font-family:"Songti SC","SimSun",serif}
.fx{opacity:0;transform:translateY(26px);transition:opacity .72s ease,transform .82s cubic-bezier(.2,.75,.2,1)}
.fx.on{opacity:1;transform:none}
.fx.d1{transition-delay:.06s}.fx.d2{transition-delay:.12s}.fx.d3{transition-delay:.18s}
#hud{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.10);z-index:6}
#bar{height:100%;width:0;background:#8c2f22}
#hint{position:absolute;right:26px;bottom:22px;font:500 15px/1 Consolas,"Courier New",monospace;letter-spacing:.18em;
  color:#6b6252;opacity:0;transition:opacity .6s ease;z-index:6}
#hint.on{opacity:.85}
#start{position:absolute;inset:0;background:#050507;display:grid;place-items:center;
  z-index:9;cursor:pointer;transition:opacity .8s ease}
#start.gone{opacity:0;pointer-events:none}
#start .t{color:#e9e6df;font:600 40px/1.5 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;letter-spacing:.42em;text-indent:.42em}
#start .s{margin-top:22px;color:#6f6a63;font:400 18px/1.6 Consolas,"Courier New",monospace;letter-spacing:.2em;text-align:center}

.desk{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 20% 10%, #ded3ba 0%, #cfc4ab 55%, #b9ad94 100%)}
.desk:after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:repeating-linear-gradient(0deg,rgba(90,78,58,.10) 0 1px,transparent 1px 4px)}
.head{position:absolute;left:96px;top:74px;font:600 20px/1 Consolas,monospace;
  letter-spacing:.42em;color:#7a6d57}
.h1{position:absolute;left:94px;top:112px;font:700 62px/1.1 "Songti SC",serif;letter-spacing:.02em}
.folder{position:absolute;top:250px;width:700px;height:600px;background:#e7dcc0;
  box-shadow:0 18px 40px rgba(60,48,30,.28);border:1px solid #c6b795}
.folder.l{left:96px;transform:rotate(-1.2deg)}
.folder.r{right:96px;transform:rotate(1deg)}
.tab{position:absolute;top:-46px;left:38px;padding:10px 30px 12px;font:600 20px/1 Consolas,monospace;
  letter-spacing:.2em;color:#f6efe0}
.tab.l{background:#8c2f22}.tab.r{background:#2f4f5f}
.fhead{position:absolute;left:38px;top:34px;font:700 42px/1.2 "Songti SC",serif}
.fcode{position:absolute;left:40px;top:92px;font:500 19px/1 Consolas,monospace;letter-spacing:.18em;color:#6b6252}
.rule{position:absolute;left:38px;right:38px;top:130px;height:2px;background:#b9a980}
.rows{position:absolute;left:38px;right:38px;top:158px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;
  border-bottom:1px dashed #c2b18d}
.row span{font:500 21px/1 "Songti SC",serif;color:#5d5442}
.row b{font:700 40px/1 Consolas,monospace;letter-spacing:-.01em}
.row em{font-style:normal;font-size:20px;color:#8c2f22;margin-left:6px;font-family:"Songti SC",serif}
.stamp{position:absolute;right:30px;bottom:26px;width:132px;height:132px;border:3px solid rgba(140,47,34,.55);
  border-radius:50%;display:grid;place-items:center;transform:rotate(-14deg);color:rgba(140,47,34,.65);
  font:700 15px/1.5 Consolas,monospace;letter-spacing:.12em;text-align:center}
.foot{position:absolute;left:96px;bottom:56px;font:500 16px/1 Consolas,monospace;color:#6b6252;letter-spacing:.1em}

</style>
</head>
<body>
<div id="wrap"><div id="stage">

<div class="desk">
  <div class="head fx" id="b1">ARCHIVE · 2025 ANNUAL REPORT</div>
  <div class="h1 fx d1" id="b2">两家公司是谁</div>
  <div class="folder l fx d2" id="b3">
    <div class="tab l">贵州茅台</div>
    <div class="fhead">贵州茅台酒</div>
    <div class="fcode">600519.SH · 上交所主板 · 贵州仁怀</div>
    <div class="rule"></div>
    <div class="rows">
      <div class="row"><span>营业收入</span><b id="m1">0</b><em>亿元</em></div>
      <div class="row"><span>归母净利润</span><b id="m2">0</b><em>亿元</em></div>
      <div class="row"><span>毛利率</span><b id="m3">0</b><em>%</em></div>
      <div class="row"><span>资产负债率</span><b id="m4">0</b><em>%</em></div>
    </div>
    <div class="stamp">合并报表<br>2025 年度</div>
  </div>
  <div class="folder r fx d3" id="b4">
    <div class="tab r">五粮液</div>
    <div class="fhead">宜宾五粮液</div>
    <div class="fcode">000858.SZ · 深交所主板 · 四川宜宾</div>
    <div class="rule"></div>
    <div class="rows">
      <div class="row"><span>营业收入</span><b id="w1">0</b><em>亿元</em></div>
      <div class="row"><span>归母净利润</span><b id="w2">0</b><em>亿元</em></div>
      <div class="row"><span>毛利率</span><b id="w3">0</b><em>%</em></div>
      <div class="row"><span>资产负债率</span><b id="w4">0</b><em>%</em></div>
    </div>
    <div class="stamp" style="border-color:rgba(47,79,95,.55);color:rgba(47,79,95,.7)">合并报表<br>2025 年度</div>
  </div>
  <div class="foot fx d3" id="b5">数据来源：两家公司 2025 年年度报告（合并报表口径）</div>
</div>

<div id="hud"><div id="bar"></div></div>
<div id="hint">SPACE 暂停 · 点右下角重播</div>
<div id="start"><div><div class="t">点 击 开 始 播 放</div>
<div class="s">档案卷宗 · 2025 年年报口径</div></div></div>
</div></div>
<script>
var DUR = 18000, CUES = [{"t": 200, "sel": "#b1", "act": "on"}, {"t": 500, "sel": "#b2", "act": "on"}, {"t": 900, "sel": "#b3", "act": "on"}, {"t": 1500, "sel": "#m1", "act": "count", "arg": 1688.38, "dec": 2}, {"t": 1900, "sel": "#m2", "act": "count", "arg": 823.2, "dec": 2}, {"t": 2300, "sel": "#m3", "act": "count", "arg": 91.18, "dec": 2}, {"t": 2700, "sel": "#m4", "act": "count", "arg": 16.42, "dec": 2}, {"t": 3400, "sel": "#b4", "act": "on"}, {"t": 4000, "sel": "#w1", "act": "count", "arg": 405.29, "dec": 2}, {"t": 4400, "sel": "#w2", "act": "count", "arg": 89.54, "dec": 2}, {"t": 4800, "sel": "#w3", "act": "count", "arg": 77.54, "dec": 2}, {"t": 5200, "sel": "#w4", "act": "count", "arg": 35.69, "dec": 2}, {"t": 6200, "sel": "#b5", "act": "on"}];
var stage = document.getElementById('stage'), bar = document.getElementById('bar');
var startEl = document.getElementById('start'), hintEl = document.getElementById('hint');
var playing = false, t0 = 0, elapsed = 0, paused = false, done = {}, timer = null;
function fit(){
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
function run(c){
  var el = document.querySelector(c.sel);
  if(!el) return;
  if(c.act === 'on'){ el.classList.add('on');
    var hv = el.style.getPropertyValue('--h'); if(hv){ el.style.height = hv; } }
  else if(c.act === 'w'){ el.style.width = c.arg + '%'; el.style.transition = 'width 1.05s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'h'){ el.style.height = c.arg + '%'; el.style.transition = 'height 1.15s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'cls'){ el.classList.add(c.arg); }
  else if(c.act === 'count'){
    var to = c.arg, dec = c.dec || 0, dur = 900, s0 = Date.now();
    var id = setInterval(function(){
      var k = Math.min(1, (Date.now() - s0) / dur);
      var v = to * (1 - Math.pow(1 - k, 3));
      el.textContent = v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
      if(k >= 1) clearInterval(id);
    }, 33);
  }
}
function tick(){
  if(!playing){ if(timer){ clearInterval(timer); timer = null; } return; }
  var now = Date.now();
  if(!paused){
    if(!t0) t0 = now;
    elapsed += now - t0; t0 = now;
    for(var i = 0; i < CUES.length; i++){
      var c = CUES[i];
      if(!done[i] && elapsed >= c.t){ done[i] = 1; run(c); }
    }
    bar.style.width = Math.min(100, elapsed / DUR * 100) + '%';
    if(elapsed >= DUR){
      playing = false; hintEl.classList.add('on'); hintEl.textContent = '重 播';
      hintEl.style.pointerEvents = 'auto'; hintEl.style.cursor = 'pointer';
      if(timer){ clearInterval(timer); timer = null; }
      return;
    }
  } else { t0 = now; }
}
function play(){
  startEl.classList.add('gone');
  playing = true; elapsed = 0; t0 = 0; done = {}; paused = false;
  bar.style.width = '0%'; hintEl.classList.remove('on');
  document.querySelectorAll('.fx').forEach(function(e){ e.classList.remove('on'); });
  if(timer) clearInterval(timer);
  timer = setInterval(tick, 16);
}
startEl.addEventListener('click', play);
if(true){ setTimeout(play, 60); }
hintEl.addEventListener('click', function(){ if(hintEl.textContent.indexOf('重') >= 0) play(); });
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault();
    if(!playing){ play(); return; }
    paused = !paused;
    document.querySelectorAll('.fx').forEach(function(el){
      el.style.transitionDuration = paused ? '0s' : '';
    });
  }
});
</script>
</body>
</html>
