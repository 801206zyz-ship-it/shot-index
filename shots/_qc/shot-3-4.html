<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>偿债能力：负债率 19.64% 与 55.49%</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#07070a;overflow:hidden}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  background:#060d0b;color:#e3f6ea;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.fx{opacity:0;transform:translateY(26px);transition:opacity .72s ease,transform .82s cubic-bezier(.2,.75,.2,1)}
.fx.on{opacity:1;transform:none}
.fx.d1{transition-delay:.06s}.fx.d2{transition-delay:.12s}.fx.d3{transition-delay:.18s}
#hud{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.10);z-index:6}
#bar{height:100%;width:0;background:#5ef0a8}
#hint{position:absolute;right:26px;bottom:22px;font:500 15px/1 Consolas,"Courier New",monospace;letter-spacing:.18em;
  color:#72928621;opacity:0;transition:opacity .6s ease;z-index:6}
#hint.on{opacity:.85}
#start{position:absolute;inset:0;background:#050507;display:grid;place-items:center;
  z-index:9;cursor:pointer;transition:opacity .8s ease}
#start.gone{opacity:0;pointer-events:none}
#start .t{color:#e9e6df;font:600 40px/1.5 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;letter-spacing:.42em;text-indent:.42em}
#start .s{margin-top:22px;color:#6f6a63;font:400 18px/1.6 Consolas,"Courier New",monospace;letter-spacing:.2em;text-align:center}

.gauge{position:absolute;inset:0;
  background:radial-gradient(70% 60% at 50% 108%,#0e3a28 0%,#08201a 45%,#060d0b 78%)}
.kick{position:absolute;left:96px;top:82px;font:700 19px/1 Consolas,monospace;letter-spacing:.42em;color:#5ef0a8}
.h1{position:absolute;left:94px;top:118px;font:700 76px/1.16 "__FONT__";letter-spacing:.01em}
.h1 em{font-style:normal;color:#5ef0a8}
.rings{position:absolute;left:0;right:0;top:300px;height:420px;display:flex;justify-content:center;
  gap:190px;align-items:flex-start}
.ring{position:relative;width:340px;height:340px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:rgba(94,240,168,.13);stroke-width:16}
.ring .fg{fill:none;stroke:#5ef0a8;stroke-width:16;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:700 74px/1 Consolas,monospace;letter-spacing:-.02em}
.ring b i{font-style:normal;font-size:30px;margin-left:6px;color:#8fd8b4}
.ring .lab{position:absolute;left:0;right:0;top:368px;text-align:center;
  font:600 22px/1.5 "__FONT__";color:#9fc4b0}
.ring .who{position:absolute;left:0;right:0;top:-46px;text-align:center;
  font:700 24px/1 "__FONT__";letter-spacing:.06em}
.ring.a .who{color:#5ef0a8}.ring.b .who{color:#ff9f43}
.ring.b .fg{stroke:#ff9f43}.ring.b .bgc{stroke:rgba(255,159,67,.14)}
.ring.b b i{color:#e0b184}
.bar2{position:absolute;left:150px;right:150px;bottom:196px;height:1px;background:rgba(94,240,168,.22)}
.note{position:absolute;left:96px;bottom:150px;font:400 21px/1.9 "__FONT__";color:#8aa79a}
.note b{color:#5ef0a8;font-family:Consolas,monospace}
.foot{position:absolute;right:96px;bottom:150px;text-align:right;
  font:400 15px/1.8 Consolas,monospace;color:#4f6f60;letter-spacing:.08em}

</style>
</head>
<body>
<div id="wrap"><div id="stage">

<div class="gauge">
  <div class="kick fx" id="c1">SOLVENCY · 2025</div>
  <div class="h1 fx d1" id="c2">谁在<em>借杠杆</em>，谁在<em>收杠杆</em></div>
  <div class="rings">
    <div class="ring a fx d2" id="c3">
      <div class="who">贵州茅台</div>
      <svg viewBox="0 0 340 340">
        <circle class="bgc" cx="170" cy="170" r="150"></circle>
        <circle class="fg" cx="170" cy="170" r="150"
          stroke-dasharray="942.5" stroke-dashoffset="757.5"></circle>
      </svg>
      <b><span id="na">0</span><i>%</i></b>
      <div class="lab">资产负债率 · 负债 4,987,559 / 资产 30,383,484（万元）</div>
    </div>
    <div class="ring b fx d3" id="c4">
      <div class="who">五粮液</div>
      <svg viewBox="0 0 340 340">
        <circle class="bgc" cx="170" cy="170" r="150"></circle>
        <circle class="fg" cx="170" cy="170" r="150"
          stroke-dasharray="942.5" stroke-dashoffset="419.4"></circle>
      </svg>
      <b><span id="nb">0</span><i>%</i></b>
      <div class="lab">资产负债率 · 负债 6,780,359 / 资产 18,998,427（万元）</div>
    </div>
  </div>
  <div class="note fx" id="c5"><b>19.64%</b> 与 <b>55.49%</b>，相差 35.85 个百分点。<br>
    两家都没有有息负债，比率高低反映的是<b>经营性占款</b>的多少，而非偿债风险。</div>
  <div class="foot">数据：2025 年报（合并口径）</div>
</div>

<div id="hud"><div id="bar"></div></div>
<div id="hint">SPACE 暂停 · 点右下角重播</div>
<div id="start"><div><div class="t">点 击 开 始 播 放</div>
<div class="s">3-4 · 双环荧光仪表 · 12,177</div></div></div>
</div></div>
<script>
var DUR = 18000, CUES = [{"t": 200, "sel": "#c1", "act": "on"}, {"t": 500, "sel": "#c2", "act": "on"}, {"t": 1000, "sel": "#c3", "act": "on"}, {"t": 1150, "sel": "#c4", "act": "on"}, {"t": 1700, "sel": "#na", "act": "count", "arg": 19.64, "dec": 2}, {"t": 1850, "sel": "#nb", "act": "count", "arg": 55.49, "dec": 2}, {"t": 3200, "sel": "#c5", "act": "on"}];
var stage = document.getElementById('stage'), bar = document.getElementById('bar');
var startEl = document.getElementById('start'), hintEl = document.getElementById('hint');
var playing = false, t0 = 0, elapsed = 0, paused = false, done = {}, timer = null;
function fit(){
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
function run(c){
  var el = document.querySelector(c.sel);
  if(!el) return;
  if(c.act === 'on'){ el.classList.add('on');
    var hv = el.style.getPropertyValue('--h'); if(hv){ el.style.height = hv; } }
  else if(c.act === 'w'){ el.style.width = c.arg + '%'; el.style.transition = 'width 1.05s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'h'){ el.style.height = c.arg + '%'; el.style.transition = 'height 1.15s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'cls'){ el.classList.add(c.arg); }
  else if(c.act === 'count'){
    var to = c.arg, dec = c.dec || 0, dur = 900, s0 = Date.now();
    var id = setInterval(function(){
      var k = Math.min(1, (Date.now() - s0) / dur);
      var v = to * (1 - Math.pow(1 - k, 3));
      el.textContent = v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
      if(k >= 1) clearInterval(id);
    }, 33);
  }
}
function tick(){
  if(!playing){ if(timer){ clearInterval(timer); timer = null; } return; }
  var now = Date.now();
  if(!paused){
    if(!t0) t0 = now;
    elapsed += now - t0; t0 = now;
    for(var i = 0; i < CUES.length; i++){
      var c = CUES[i];
      if(!done[i] && elapsed >= c.t){ done[i] = 1; run(c); }
    }
    bar.style.width = Math.min(100, elapsed / DUR * 100) + '%';
    if(elapsed >= DUR){
      playing = false; hintEl.classList.add('on'); hintEl.textContent = '重 播';
      hintEl.style.pointerEvents = 'auto'; hintEl.style.cursor = 'pointer';
      if(timer){ clearInterval(timer); timer = null; }
      return;
    }
  } else { t0 = now; }
}
function play(){
  startEl.classList.add('gone');
  playing = true; elapsed = 0; t0 = 0; done = {}; paused = false;
  bar.style.width = '0%'; hintEl.classList.remove('on');
  document.querySelectorAll('.fx').forEach(function(e){ e.classList.remove('on'); });
  if(timer) clearInterval(timer);
  timer = setInterval(tick, 16);
}
startEl.addEventListener('click', play);
if(true){ setTimeout(play, 60); }
hintEl.addEventListener('click', function(){ if(hintEl.textContent.indexOf('重') >= 0) play(); });
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault();
    if(!playing){ play(); return; }
    paused = !paused;
    document.querySelectorAll('.fx').forEach(function(el){
      el.style.transitionDuration = paused ? '0s' : '';
    });
  }
});
</script>
</body>
</html>
