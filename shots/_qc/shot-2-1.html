<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>资产负债表：一个高现金，一个扩产加预收</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#07070a;overflow:hidden}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  background:#101a16;color:#eee6d2;
  font-family:"Songti SC","SimSun",serif}
.fx{opacity:0;transform:translateY(26px);transition:opacity .72s ease,transform .82s cubic-bezier(.2,.75,.2,1)}
.fx.on{opacity:1;transform:none}
.fx.d1{transition-delay:.06s}.fx.d2{transition-delay:.12s}.fx.d3{transition-delay:.18s}
#hud{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.10);z-index:6}
#bar{height:100%;width:0;background:#c9a227}
#hint{position:absolute;right:26px;bottom:22px;font:500 15px/1 Consolas,"Courier New",monospace;letter-spacing:.18em;
  color:#8d9584;opacity:0;transition:opacity .6s ease;z-index:6}
#hint.on{opacity:.85}
#start{position:absolute;inset:0;background:#050507;display:grid;place-items:center;
  z-index:9;cursor:pointer;transition:opacity .8s ease}
#start.gone{opacity:0;pointer-events:none}
#start .t{color:#e9e6df;font:600 40px/1.5 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;letter-spacing:.42em;text-indent:.42em}
#start .s{margin-top:22px;color:#6f6a63;font:400 18px/1.6 Consolas,"Courier New",monospace;letter-spacing:.2em;text-align:center}

.brass{position:absolute;inset:0;background:
  radial-gradient(90% 70% at 50% 0%, #1b2a23 0%, #101a16 60%, #0a1210 100%)}
.kick{position:absolute;left:96px;top:82px;font:600 20px/1 Consolas,monospace;letter-spacing:.4em;color:#c9a227}
.h1{position:absolute;left:94px;top:120px;font:700 58px/1.15 "Songti SC",serif;color:#eee6d2}
.scale{position:absolute;left:50%;top:268px;width:1200px;margin-left:-600px;height:520px}
.post{position:absolute;left:588px;top:60px;width:24px;height:400px;background:linear-gradient(90deg,#7a5f18,#d9b23c 45%,#7a5f18)}
.base{position:absolute;left:430px;top:452px;width:340px;height:16px;background:linear-gradient(90deg,#7a5f18,#d9b23c,#7a5f18);
  border-radius:8px}
.arm{position:absolute;left:120px;top:58px;width:960px;height:12px;border-radius:6px;
  background:linear-gradient(90deg,#7a5f18,#e6c258 50%,#7a5f18);transform-origin:50% 50%;
  transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.arm.tilt{transform:rotate(7.6deg)}
.pan{position:absolute;top:120px;width:400px;text-align:center;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.pan.a{left:20px}.pan.b{right:20px}
.pan.a.drop{transform:translateY(64px)}
.pan .line{width:2px;height:70px;margin:0 auto;background:#b8942a}
.pan .dish{width:400px;height:22px;border-radius:0 0 200px 200px;background:linear-gradient(180deg,#d9b23c,#8a6a1a)}
.pan .big{font:900 84px/1 Impact,"Arial Black",sans-serif;color:#f4ea4a;letter-spacing:-.02em;
  margin-top:-14px}
.pan .cap{font:500 22px/1.6 "Songti SC",serif;color:#b9bfae;margin-top:10px}
.pan .tag{display:inline-block;margin-top:16px;padding:8px 18px;border:1px solid rgba(201,162,39,.6);
  font:600 18px/1 Consolas,monospace;letter-spacing:.16em;color:#c9a227}
.legend{position:absolute;left:96px;bottom:120px;font:500 21px/2 "Songti SC",serif;color:#9aa392}
.legend b{color:#f4ea4a;font-family:Consolas,monospace}
.foot{position:absolute;right:96px;bottom:66px;font:400 15px/1 Consolas,monospace;color:#6f7a6b;letter-spacing:.1em}

</style>
</head>
<body>
<div id="wrap"><div id="stage">

<div class="brass">
  <div class="kick fx" id="c1">BALANCE SHEET · 2025</div>
  <div class="h1 fx d1" id="c2">一个高现金，一个扩产加预收</div>
  <div class="scale">
    <div class="post fx d2" id="c3"></div>
    <div class="base fx d2" id="c4"></div>
    <div class="arm" id="arm"></div>
    <div class="pan a" id="panA">
      <div class="line"></div><div class="dish"></div>
      <div class="big" id="k1">0</div>
      <div class="cap">流动比率<br>流动资产 ÷ 流动负债</div>
      <div class="tag">茅台 5.09×</div>
    </div>
    <div class="pan b" id="panB">
      <div class="line"></div><div class="dish"></div>
      <div class="big" id="k2">0</div>
      <div class="cap">流动比率<br>流动资产 ÷ 流动负债</div>
      <div class="tag">五粮液 2.45×</div>
    </div>
  </div>
  <div class="legend fx d3" id="c5">资产总计：茅台 <b>3,038.35</b> 亿元　｜　五粮液 <b>1,899.84</b> 亿元<br>
  负债合计：茅台 <b>498.76</b> 亿元　｜　五粮液 <b>678.04</b> 亿元</div>
  <div class="foot fx d3" id="c6">数据：2025 年年度报告（合并报表口径）</div>
</div>

<div id="hud"><div id="bar"></div></div>
<div id="hint">SPACE 暂停 · 点右下角重播</div>
<div id="start"><div><div class="t">点 击 开 始 播 放</div>
<div class="s">黄铜天平 · 资产与负债的两端</div></div></div>
</div></div>
<script>
var DUR = 18000, CUES = [{"t": 200, "sel": "#c1", "act": "on"}, {"t": 500, "sel": "#c2", "act": "on"}, {"t": 900, "sel": "#c3", "act": "on"}, {"t": 1050, "sel": "#c4", "act": "on"}, {"t": 1500, "sel": "#k1", "act": "count", "arg": 5.09, "dec": 2}, {"t": 1900, "sel": "#k2", "act": "count", "arg": 2.45, "dec": 2}, {"t": 2600, "sel": "#panA", "act": "cls", "arg": "drop"}, {"t": 2750, "sel": "#arm", "act": "cls", "arg": "tilt"}, {"t": 3800, "sel": "#c5", "act": "on"}, {"t": 4600, "sel": "#c6", "act": "on"}];
var stage = document.getElementById('stage'), bar = document.getElementById('bar');
var startEl = document.getElementById('start'), hintEl = document.getElementById('hint');
var playing = false, t0 = 0, elapsed = 0, paused = false, done = {}, timer = null;
function fit(){
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
function run(c){
  var el = document.querySelector(c.sel);
  if(!el) return;
  if(c.act === 'on'){ el.classList.add('on');
    var hv = el.style.getPropertyValue('--h'); if(hv){ el.style.height = hv; } }
  else if(c.act === 'w'){ el.style.width = c.arg + '%'; el.style.transition = 'width 1.05s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'h'){ el.style.height = c.arg + '%'; el.style.transition = 'height 1.15s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'cls'){ el.classList.add(c.arg); }
  else if(c.act === 'count'){
    var to = c.arg, dec = c.dec || 0, dur = 900, s0 = Date.now();
    var id = setInterval(function(){
      var k = Math.min(1, (Date.now() - s0) / dur);
      var v = to * (1 - Math.pow(1 - k, 3));
      el.textContent = v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
      if(k >= 1) clearInterval(id);
    }, 33);
  }
}
function tick(){
  if(!playing){ if(timer){ clearInterval(timer); timer = null; } return; }
  var now = Date.now();
  if(!paused){
    if(!t0) t0 = now;
    elapsed += now - t0; t0 = now;
    for(var i = 0; i < CUES.length; i++){
      var c = CUES[i];
      if(!done[i] && elapsed >= c.t){ done[i] = 1; run(c); }
    }
    bar.style.width = Math.min(100, elapsed / DUR * 100) + '%';
    if(elapsed >= DUR){
      playing = false; hintEl.classList.add('on'); hintEl.textContent = '重 播';
      hintEl.style.pointerEvents = 'auto'; hintEl.style.cursor = 'pointer';
      if(timer){ clearInterval(timer); timer = null; }
      return;
    }
  } else { t0 = now; }
}
function play(){
  startEl.classList.add('gone');
  playing = true; elapsed = 0; t0 = 0; done = {}; paused = false;
  bar.style.width = '0%'; hintEl.classList.remove('on');
  document.querySelectorAll('.fx').forEach(function(e){ e.classList.remove('on'); });
  if(timer) clearInterval(timer);
  timer = setInterval(tick, 16);
}
startEl.addEventListener('click', play);
if(true){ setTimeout(play, 60); }
hintEl.addEventListener('click', function(){ if(hintEl.textContent.indexOf('重') >= 0) play(); });
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault();
    if(!playing){ play(); return; }
    paused = !paused;
    document.querySelectorAll('.fx').forEach(function(el){
      el.style.transitionDuration = paused ? '0s' : '';
    });
  }
});
</script>
</body>
</html>
