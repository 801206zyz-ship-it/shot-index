<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>盈利能力：四条线，两个世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#07070a;overflow:hidden}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  background:#120b09;color:#ffe9d6;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.fx{opacity:0;transform:translateY(26px);transition:opacity .72s ease,transform .82s cubic-bezier(.2,.75,.2,1)}
.fx.on{opacity:1;transform:none}
.fx.d1{transition-delay:.06s}.fx.d2{transition-delay:.12s}.fx.d3{transition-delay:.18s}
#hud{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.10);z-index:6}
#bar{height:100%;width:0;background:#ff6a1a}
#hint{position:absolute;right:26px;bottom:22px;font:500 15px/1 Consolas,"Courier New",monospace;letter-spacing:.18em;
  color:#9c7a63;opacity:0;transition:opacity .6s ease;z-index:6}
#hint.on{opacity:.85}
#start{position:absolute;inset:0;background:#050507;display:grid;place-items:center;
  z-index:9;cursor:pointer;transition:opacity .8s ease}
#start.gone{opacity:0;pointer-events:none}
#start .t{color:#e9e6df;font:600 40px/1.5 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;letter-spacing:.42em;text-indent:.42em}
#start .s{margin-top:22px;color:#6f6a63;font:400 18px/1.6 Consolas,"Courier New",monospace;letter-spacing:.2em;text-align:center}

.furnace{position:absolute;inset:0;background:
  radial-gradient(80% 70% at 50% 118%, #6b2404 0%, #2a0f06 42%, #120b09 72%, #0a0709 100%)}
.kick{position:absolute;left:96px;top:80px;font:700 20px/1 Consolas,monospace;letter-spacing:.4em;color:#ff6a1a}
.h1{position:absolute;left:94px;top:118px;font:800 58px/1.15 "PingFang SC",sans-serif;color:#ffe9d6}
.h1 em{font-style:normal;color:#ff6a1a}
.legend{position:absolute;right:110px;top:150px;text-align:right;
  font:600 18px/2 Consolas,monospace;color:#9c7a63;letter-spacing:.08em}
.legend i{display:inline-block;width:16px;height:16px;margin-right:10px;vertical-align:-2px}
.legend .sa{background:linear-gradient(180deg,#ffd166,#c2410c)}
.legend .sb{background:#5d3a2b}
.chart{position:absolute;left:110px;right:110px;bottom:210px;height:420px;display:flex;gap:74px;
  align-items:flex-end;border-bottom:2px solid rgba(255,106,26,.35)}
.grp{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:12px}
.grp .gl{position:absolute;left:0;right:0;bottom:-54px;text-align:center;
  font:600 21px/1.4 "PingFang SC",sans-serif;color:#c9a48b}
.col{position:relative;width:74px;height:100%;display:flex;align-items:flex-end}
.fill{position:relative;width:100%;height:var(--h);border-radius:3px 3px 0 0}
.fill.a{background:linear-gradient(180deg,#ffd166 0%,#ff8c1a 55%,#c2410c 100%);
  box-shadow:0 0 28px rgba(255,140,26,.35)}
.fill.b{background:linear-gradient(180deg,#8a5a44 0%,#5d3a2b 60%,#3a2318 100%)}
.val{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font:700 23px/1 Consolas,monospace;
  color:#ffe9d6;white-space:nowrap}
.note{position:absolute;left:110px;bottom:92px;font:400 22px/1.85 "PingFang SC",sans-serif;color:#b08a72}
.note b{color:#ff8c1a;font-family:Consolas,monospace}
.foot{position:absolute;right:110px;bottom:56px;font:400 15px/1 Consolas,monospace;color:#7a5a48;letter-spacing:.1em}

</style>
</head>
<body>
<div id="wrap"><div id="stage">

<div class="furnace">
  <div class="kick fx" id="k1c">PROFITABILITY · 4 METRICS</div>
  <div class="h1 fx d1" id="k2c">四条线，<em>两个世界</em></div>
  <div class="legend fx d2" id="k3c"><div><i class="sa"></i>贵州茅台</div><div><i class="sb"></i>五粮液</div></div>
  <div class="chart fx" id="chc">
    <div class="grp">
      <div class="col"><div class="fill a" id="ba1" style="--h:91%"><div class="val" id="va1">0</div></div></div>
      <div class="col"><div class="fill b" id="bb1" style="--h:78%"><div class="val" id="vb1">0</div></div></div>
      <div class="gl">毛利率</div></div>
    <div class="grp">
      <div class="col"><div class="fill a" id="ba2" style="--h:68%"><div class="val" id="va2">0</div></div></div>
      <div class="col"><div class="fill b" id="bb2" style="--h:30%"><div class="val" id="vb2">0</div></div></div>
      <div class="gl">营业利润率</div></div>
    <div class="grp">
      <div class="col"><div class="fill a" id="ba3" style="--h:49%"><div class="val" id="va3">0</div></div></div>
      <div class="col"><div class="fill b" id="bb3" style="--h:22%"><div class="val" id="vb3">0</div></div></div>
      <div class="gl">净利率</div></div>
    <div class="grp">
      <div class="col"><div class="fill a" id="ba4" style="--h:46%"><div class="val" id="va4">0</div></div></div>
      <div class="col"><div class="fill b" id="bb4" style="--h:9%"><div class="val" id="vb4">0</div></div></div>
      <div class="gl">资本回报率</div></div>
  </div>
  <div class="note fx d3" id="k4c">毛利率只差 <b>13.64pct</b>，营业利润率差 <b>37.77pct</b>，资本回报率差 <b>36.83pct</b>——差距发生在毛利率以下。</div>
  <div class="foot fx d3" id="k5c">数据：2024 / 2025 年度报告（合并报表口径）</div>
</div>

<div id="hud"><div id="bar"></div></div>
<div id="hint">SPACE 暂停 · 点右下角重播</div>
<div id="start"><div><div class="t">点 击 开 始 播 放</div>
<div class="s">熔炉渐变柱状 · 四项利润率</div></div></div>
</div></div>
<script>
var DUR = 22000, CUES = [{"t": 200, "sel": "#k1c", "act": "on"}, {"t": 450, "sel": "#k2c", "act": "on"}, {"t": 700, "sel": "#k3c", "act": "on"}, {"t": 900, "sel": "#chc", "act": "on"}, {"t": 1250, "sel": "#bb1", "act": "on"}, {"t": 1500, "sel": "#va1", "act": "count", "arg": 91.18, "dec": 2}, {"t": 1600, "sel": "#vb1", "act": "count", "arg": 77.54, "dec": 2}, {"t": 2400, "sel": "#ba2", "act": "on"}, {"t": 2550, "sel": "#bb2", "act": "on"}, {"t": 2800, "sel": "#va2", "act": "count", "arg": 68.0, "dec": 2}, {"t": 2900, "sel": "#vb2", "act": "count", "arg": 30.23, "dec": 2}, {"t": 3700, "sel": "#ba3", "act": "on"}, {"t": 3850, "sel": "#bb3", "act": "on"}, {"t": 4100, "sel": "#va3", "act": "count", "arg": 48.76, "dec": 2}, {"t": 4200, "sel": "#vb3", "act": "count", "arg": 22.09, "dec": 2}, {"t": 5000, "sel": "#ba4", "act": "on"}, {"t": 5150, "sel": "#bb4", "act": "on"}, {"t": 5400, "sel": "#va4", "act": "count", "arg": 46.29, "dec": 2}, {"t": 5500, "sel": "#vb4", "act": "count", "arg": 9.46, "dec": 2}, {"t": 6400, "sel": "#k4c", "act": "on"}, {"t": 7200, "sel": "#k5c", "act": "on"}];
var stage = document.getElementById('stage'), bar = document.getElementById('bar');
var startEl = document.getElementById('start'), hintEl = document.getElementById('hint');
var playing = false, t0 = 0, elapsed = 0, paused = false, done = {}, timer = null;
function fit(){
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
function run(c){
  var el = document.querySelector(c.sel);
  if(!el) return;
  if(c.act === 'on'){ el.classList.add('on');
    var hv = el.style.getPropertyValue('--h'); if(hv){ el.style.height = hv; } }
  else if(c.act === 'w'){ el.style.width = c.arg + '%'; el.style.transition = 'width 1.05s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'h'){ el.style.height = c.arg + '%'; el.style.transition = 'height 1.15s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'cls'){ el.classList.add(c.arg); }
  else if(c.act === 'count'){
    var to = c.arg, dec = c.dec || 0, dur = 900, s0 = Date.now();
    var id = setInterval(function(){
      var k = Math.min(1, (Date.now() - s0) / dur);
      var v = to * (1 - Math.pow(1 - k, 3));
      el.textContent = v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
      if(k >= 1) clearInterval(id);
    }, 33);
  }
}
function tick(){
  if(!playing){ if(timer){ clearInterval(timer); timer = null; } return; }
  var now = Date.now();
  if(!paused){
    if(!t0) t0 = now;
    elapsed += now - t0; t0 = now;
    for(var i = 0; i < CUES.length; i++){
      var c = CUES[i];
      if(!done[i] && elapsed >= c.t){ done[i] = 1; run(c); }
    }
    bar.style.width = Math.min(100, elapsed / DUR * 100) + '%';
    if(elapsed >= DUR){
      playing = false; hintEl.classList.add('on'); hintEl.textContent = '重 播';
      hintEl.style.pointerEvents = 'auto'; hintEl.style.cursor = 'pointer';
      if(timer){ clearInterval(timer); timer = null; }
      return;
    }
  } else { t0 = now; }
}
function play(){
  startEl.classList.add('gone');
  playing = true; elapsed = 0; t0 = 0; done = {}; paused = false;
  bar.style.width = '0%'; hintEl.classList.remove('on');
  document.querySelectorAll('.fx').forEach(function(e){ e.classList.remove('on'); });
  if(timer) clearInterval(timer);
  timer = setInterval(tick, 16);
}
startEl.addEventListener('click', play);
if(true){ setTimeout(play, 60); }
hintEl.addEventListener('click', function(){ if(hintEl.textContent.indexOf('重') >= 0) play(); });
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault();
    if(!playing){ play(); return; }
    paused = !paused;
    document.querySelectorAll('.fx').forEach(function(el){
      el.style.transitionDuration = paused ? '0s' : '';
    });
  }
});
</script>
</body>
</html>
