<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>流动性：5.09× 与 2.45× 的水位差</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#07070a;overflow:hidden}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;overflow:hidden;
  transform:translate(-50%,-50%) scale(1);transform-origin:center center;
  background:#04121c;color:#e6f6ff;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.fx{opacity:0;transform:translateY(26px);transition:opacity .72s ease,transform .82s cubic-bezier(.2,.75,.2,1)}
.fx.on{opacity:1;transform:none}
.fx.d1{transition-delay:.06s}.fx.d2{transition-delay:.12s}.fx.d3{transition-delay:.18s}
#hud{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.10);z-index:6}
#bar{height:100%;width:0;background:#28c2ff}
#hint{position:absolute;right:26px;bottom:22px;font:500 15px/1 Consolas,"Courier New",monospace;letter-spacing:.18em;
  color:#5b87a1;opacity:0;transition:opacity .6s ease;z-index:6}
#hint.on{opacity:.85}
#start{position:absolute;inset:0;background:#050507;display:grid;place-items:center;
  z-index:9;cursor:pointer;transition:opacity .8s ease}
#start.gone{opacity:0;pointer-events:none}
#start .t{color:#e9e6df;font:600 40px/1.5 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;letter-spacing:.42em;text-indent:.42em}
#start .s{margin-top:22px;color:#6f6a63;font:400 18px/1.6 Consolas,"Courier New",monospace;letter-spacing:.2em;text-align:center}

.deep{position:absolute;inset:0;background:
  radial-gradient(100% 90% at 50% 110%, #0a3550 0%, #04121c 55%, #020a11 100%)}
.kick{position:absolute;left:96px;top:80px;font:700 20px/1 Consolas,monospace;letter-spacing:.4em;color:#28c2ff}
.h1{position:absolute;left:94px;top:118px;font:800 62px/1.15 "PingFang SC",sans-serif;color:#e6f6ff}
.h1 em{font-style:normal;color:#28c2ff}
.tanks{position:absolute;left:50%;margin-left:-520px;top:270px;width:1040px;height:560px;
  display:flex;gap:200px;justify-content:center}
.tank{position:relative;width:240px;height:500px;border:2px solid rgba(40,194,255,.45);
  border-radius:6px 6px 0 0;background:rgba(6,32,48,.55)}
.tank .water{position:absolute;left:0;bottom:0;width:100%;height:0;
  background:linear-gradient(180deg,#39d3ff 0%,#1173a8 55%,#0a4a6e 100%);opacity:.86}
.tank .glow{position:absolute;left:0;right:0;height:3px;bottom:0;background:#8ce8ff;opacity:.9;box-shadow:0 0 22px #39d3ff}
.tticks{position:absolute;left:-120px;top:0;bottom:0;width:112px}
.tticks span{position:absolute;right:0;font:500 15px/1 Consolas,monospace;color:#4d7d96;transform:translateY(-50%)}
.tticks span:after{content:"";position:absolute;left:100%;top:50%;width:14px;height:1px;background:rgba(40,194,255,.35)}
.tcap{position:absolute;left:50%;transform:translateX(-50%);bottom:-118px;text-align:center;width:420px}
.tcap b{display:block;font:900 72px/1 Impact,"Arial Black",sans-serif;color:#e6f6ff}
.tcap b i{font-style:normal;font-size:38px;color:#28c2ff}
.tcap span{display:block;margin-top:8px;font:600 21px/1.4 "PingFang SC",sans-serif;color:#9dbfd2}
.note{position:absolute;left:96px;bottom:92px;font:400 21px/1.9 "PingFang SC",sans-serif;color:#7fa6bb}
.note b{color:#28c2ff;font-family:Consolas,monospace}
.foot{position:absolute;right:96px;bottom:56px;font:400 15px/1 Consolas,monospace;color:#41697d;letter-spacing:.1em}

</style>
</head>
<body>
<div id="wrap"><div id="stage">

<div class="deep">
  <div class="kick fx" id="h1c">CURRENT RATIO · 2025</div>
  <div class="h1 fx d1" id="h2">5.09× 与 <em>2.45×</em> 的水位差</div>
  <div class="tanks">
    <div class="tank">
      <div class="tticks"><span style="bottom:0">0</span><span style="bottom:25%">2×</span>
        <span style="bottom:50%">4×</span><span style="bottom:75%">6×</span></div>
      <div class="water" id="wa"></div><div class="glow" id="ga"></div>
      <div class="tcap fx d2" id="h3"><b>5.09<i>×</i></b><span>贵州茅台 · 流动资产 25,251,866 万元</span></div>
    </div>
    <div class="tank">
      <div class="tticks"><span style="bottom:0">0</span><span style="bottom:25%">2×</span>
        <span style="bottom:50%">4×</span><span style="bottom:75%">6×</span></div>
      <div class="water" id="wb"></div><div class="glow" id="gb"></div>
      <div class="tcap fx d3" id="h4"><b>2.45<i>×</i></b><span>五粮液 · 流动资产 16,475,156 万元</span></div>
    </div>
  </div>
  <div class="note fx d3" id="h5">同样是先款后货：茅台把钱留在账上，五粮液把钱变成了库存与预收。<br>
  分母（流动负债）：<b>496.10 亿 对 673.52 亿</b></div>
  <div class="foot fx d3" id="h6">数据：2025 年年度报告（合并报表口径）</div>
</div>

<div id="hud"><div id="bar"></div></div>
<div id="hint">SPACE 暂停 · 点右下角重播</div>
<div id="start"><div><div class="t">点 击 开 始 播 放</div>
<div class="s">深水水位仪表 · 流动比率</div></div></div>
</div></div>
<script>
var DUR = 18000, CUES = [{"t": 200, "sel": "#h1c", "act": "on"}, {"t": 450, "sel": "#h2", "act": "on"}, {"t": 900, "sel": "#h3", "act": "on"}, {"t": 950, "sel": "#wa", "act": "h", "arg": 64}, {"t": 1050, "sel": "#ga", "act": "h", "arg": 64}, {"t": 2100, "sel": "#h4", "act": "on"}, {"t": 2150, "sel": "#wb", "act": "h", "arg": 31}, {"t": 2250, "sel": "#gb", "act": "h", "arg": 31}, {"t": 3600, "sel": "#h5", "act": "on"}, {"t": 4300, "sel": "#h6", "act": "on"}];
var stage = document.getElementById('stage'), bar = document.getElementById('bar');
var startEl = document.getElementById('start'), hintEl = document.getElementById('hint');
var playing = false, t0 = 0, elapsed = 0, paused = false, done = {}, timer = null;
function fit(){
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
function run(c){
  var el = document.querySelector(c.sel);
  if(!el) return;
  if(c.act === 'on'){ el.classList.add('on');
    var hv = el.style.getPropertyValue('--h'); if(hv){ el.style.height = hv; } }
  else if(c.act === 'w'){ el.style.width = c.arg + '%'; el.style.transition = 'width 1.05s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'h'){ el.style.height = c.arg + '%'; el.style.transition = 'height 1.15s cubic-bezier(.2,.8,.2,1)'; }
  else if(c.act === 'cls'){ el.classList.add(c.arg); }
  else if(c.act === 'count'){
    var to = c.arg, dec = c.dec || 0, dur = 900, s0 = Date.now();
    var id = setInterval(function(){
      var k = Math.min(1, (Date.now() - s0) / dur);
      var v = to * (1 - Math.pow(1 - k, 3));
      el.textContent = v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
      if(k >= 1) clearInterval(id);
    }, 33);
  }
}
function tick(){
  if(!playing){ if(timer){ clearInterval(timer); timer = null; } return; }
  var now = Date.now();
  if(!paused){
    if(!t0) t0 = now;
    elapsed += now - t0; t0 = now;
    for(var i = 0; i < CUES.length; i++){
      var c = CUES[i];
      if(!done[i] && elapsed >= c.t){ done[i] = 1; run(c); }
    }
    bar.style.width = Math.min(100, elapsed / DUR * 100) + '%';
    if(elapsed >= DUR){
      playing = false; hintEl.classList.add('on'); hintEl.textContent = '重 播';
      hintEl.style.pointerEvents = 'auto'; hintEl.style.cursor = 'pointer';
      if(timer){ clearInterval(timer); timer = null; }
      return;
    }
  } else { t0 = now; }
}
function play(){
  startEl.classList.add('gone');
  playing = true; elapsed = 0; t0 = 0; done = {}; paused = false;
  bar.style.width = '0%'; hintEl.classList.remove('on');
  document.querySelectorAll('.fx').forEach(function(e){ e.classList.remove('on'); });
  if(timer) clearInterval(timer);
  timer = setInterval(tick, 16);
}
startEl.addEventListener('click', play);
if(true){ setTimeout(play, 60); }
hintEl.addEventListener('click', function(){ if(hintEl.textContent.indexOf('重') >= 0) play(); });
window.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault();
    if(!playing){ play(); return; }
    paused = !paused;
    document.querySelectorAll('.fx').forEach(function(el){
      el.style.transitionDuration = paused ? '0s' : '';
    });
  }
});
</script>
</body>
</html>
